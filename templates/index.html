<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Prompt Studio</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="wrapper">

    <div class="hero">

        <div class="hero-content">

            <h1>
                ✨ AI Prompt Studio
            </h1>

            <p>
                Transform simple ideas into professional AI image prompts.
            </p>

        </div>

    </div>

    <div class="main-card">

        <div class="input-section">

            <label>

                Describe your image idea

            </label>

            <textarea
            id="promptInput"
            placeholder="Example: futuristic dragon flying above a neon city">
            </textarea>

            <div class="char-count">

                <span id="charCount">

                    0

                </span>

                characters

            </div>

        </div>

        <div class="styles-section">

            <label>

                Select Style

            </label>

            <div class="style-chips">

                <button
                class="style-chip active"
                data-style="Photorealistic">

                Photorealistic

                </button>

                <button
                class="style-chip"
                data-style="Fantasy">

                Fantasy

                </button>

                <button
                class="style-chip"
                data-style="Cinematic">

                Cinematic

                </button>

                <button
                class="style-chip"
                data-style="Anime">

                Anime

                </button>

                <button
                class="style-chip"
                data-style="Cyberpunk">

                Cyberpunk

                </button>

                <button
                class="style-chip"
                data-style="Watercolor">

                Watercolor

                </button>

            </div>

        </div>

        <button
        id="generateBtn"
        class="generate-btn">

        Generate Prompts

        </button>

    </div>

    <div
    id="loader"
    class="loader hidden">

        Generating prompt variations...

    </div>

    <div
    id="results"
    class="results-grid">

    </div>

    <div class="history-container">

        <button
        id="historyToggle">

        Recent Prompts ▼

        </button>

        <div
        id="history-list"
        class="history-list">

            {% for item in history %}

            <div class="history-item">

                {{ item.prompt }}

            </div>

            {% endfor %}

        </div>

    </div>

</div>

<script
src="{{ url_for('static',
filename='script.js') }}">
</script>

</body>

</html>
